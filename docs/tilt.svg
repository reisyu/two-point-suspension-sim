<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440"
     font-family="Meiryo, 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2024">部材は「重心がいちばん低くなる姿勢」で止まる</text>
  <line x1="380" y1="70" x2="380" y2="400" stroke="#e5e7eb"/>

  <!-- ===== 左：重心が中央 ===== -->
  <line x1="95" y1="95" x2="305" y2="95" stroke="#94a3b8" stroke-width="2.5"/>
  <g stroke="#94a3b8" stroke-width="1.4">
    <line x1="101" y1="95" x2="91" y2="83"/><line x1="126" y1="95" x2="116" y2="83"/>
    <line x1="151" y1="95" x2="141" y2="83"/><line x1="176" y1="95" x2="166" y2="83"/>
    <line x1="201" y1="95" x2="191" y2="83"/><line x1="226" y1="95" x2="216" y2="83"/>
    <line x1="251" y1="95" x2="241" y2="83"/><line x1="276" y1="95" x2="266" y2="83"/>
    <line x1="301" y1="95" x2="291" y2="83"/>
  </g>
  <line x1="150" y1="95" x2="140" y2="255" stroke="#334155" stroke-width="2.5"/>
  <line x1="250" y1="95" x2="260" y2="255" stroke="#334155" stroke-width="2.5"/>
  <polygon points="141,86 159,86 150,99" fill="#94a3b8"/>
  <polygon points="241,86 259,86 250,99" fill="#94a3b8"/>
  <rect x="120" y="255" width="160" height="34" fill="#dbe6fb" stroke="#2563eb" stroke-width="2"/>
  <circle cx="140" cy="255" r="5" fill="#fff" stroke="#334155" stroke-width="2.2"/>
  <circle cx="260" cy="255" r="5" fill="#fff" stroke="#334155" stroke-width="2.2"/>
  <line x1="105" y1="289" x2="295" y2="289" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="300" y="293" font-size="11" fill="#16a34a">水平</text>
  <g>
    <path d="M200,272 L192,272 A8,8 0 0 1 200,264 Z" fill="#1c2024"/>
    <path d="M200,272 L208,272 A8,8 0 0 1 200,280 Z" fill="#1c2024"/>
    <circle cx="200" cy="272" r="8" fill="none" stroke="#1c2024" stroke-width="1.7"/>
  </g>
  <line x1="200" y1="280" x2="200" y2="322" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="200" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2024">重心が真ん中にある</text>
  <text x="200" y="376" text-anchor="middle" font-size="12" fill="#64748b">→ 水平に吊れる</text>
  <text x="200" y="396" text-anchor="middle" font-size="12" fill="#64748b">両側のワイヤーに同じ力</text>

  <!-- ===== 右：重心が片側に寄る ===== -->
  <line x1="455" y1="95" x2="665" y2="95" stroke="#94a3b8" stroke-width="2.5"/>
  <g stroke="#94a3b8" stroke-width="1.4">
    <line x1="461" y1="95" x2="451" y2="83"/><line x1="486" y1="95" x2="476" y2="83"/>
    <line x1="511" y1="95" x2="501" y2="83"/><line x1="536" y1="95" x2="526" y2="83"/>
    <line x1="561" y1="95" x2="551" y2="83"/><line x1="586" y1="95" x2="576" y2="83"/>
    <line x1="611" y1="95" x2="601" y2="83"/><line x1="636" y1="95" x2="626" y2="83"/>
    <line x1="661" y1="95" x2="651" y2="83"/>
  </g>
  <line x1="505" y1="95" x2="505.3" y2="241.9" stroke="#334155" stroke-width="2.5"/>
  <line x1="615" y1="95" x2="622.3" y2="268.9" stroke="#334155" stroke-width="2.5"/>
  <polygon points="496,86 514,86 505,99" fill="#94a3b8"/>
  <polygon points="606,86 624,86 615,99" fill="#94a3b8"/>
  <g transform="rotate(13 560 272)">
    <rect x="480" y="255" width="160" height="34" fill="#dbe6fb" stroke="#2563eb" stroke-width="2"/>
    <rect x="600" y="255" width="40" height="34" fill="#8fb1ec" stroke="#2563eb" stroke-width="2"/>
  </g>
  <circle cx="505.3" cy="241.9" r="5" fill="#fff" stroke="#334155" stroke-width="2.2"/>
  <circle cx="622.3" cy="268.9" r="5" fill="#fff" stroke="#334155" stroke-width="2.2"/>
  <line x1="478.2" y1="270.6" x2="556" y2="270.6" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M523.2,270.6 A45,45 0 0 1 522.0,280.7" fill="none" stroke="#0f766e" stroke-width="1.8"/>
  <text x="537" y="291" font-size="13" font-weight="bold" fill="#0f766e">13°</text>
  <g>
    <path d="M589.2,278.8 L581.2,278.8 A8,8 0 0 1 589.2,270.8 Z" fill="#1c2024"/>
    <path d="M589.2,278.8 L597.2,278.8 A8,8 0 0 1 589.2,286.8 Z" fill="#1c2024"/>
    <circle cx="589.2" cy="278.8" r="8" fill="none" stroke="#1c2024" stroke-width="1.7"/>
  </g>
  <line x1="589.2" y1="286.8" x2="589.2" y2="322" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M632,290 L676,318" stroke="#9ca3af" stroke-width="1" fill="none"/>
  <text x="680" y="322" font-size="11" fill="#64748b">重い部分</text>
  <text x="575" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2024">重心が片側に寄っている</text>
  <text x="575" y="376" text-anchor="middle" font-size="12" fill="#64748b">→ 重い側が下がって傾く</text>
  <text x="575" y="396" text-anchor="middle" font-size="12" fill="#64748b">重心側のワイヤーに力が集中</text>

  <text x="380" y="428" text-anchor="middle" font-size="12" fill="#64748b">重心（オレンジの破線）は、必ず吊り点の真下あたりに落ち着きます</text>
</svg>
