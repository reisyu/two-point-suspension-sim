<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470"
     font-family="Meiryo, 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2024">同じ寸法でも、落ち着き先が2つあることがある</text>
  <text x="380" y="47" text-anchor="middle" font-size="12" fill="#64748b">プリセット「細長い棒」／吊り点 ±0.60 m・ワイヤー長 1.50 m — どちらも実際の計算結果</text>
  <line x1="380" y1="62" x2="380" y2="400" stroke="#e5e7eb"/>

  <!-- ================= 左：大域最小 ================= -->
  <line x1="82" y1="90" x2="298" y2="90" stroke="#94a3b8" stroke-width="2.5"/>
  <g stroke="#94a3b8" stroke-width="1.4">
    <line x1="88" y1="90" x2="78" y2="78"/><line x1="115" y1="90" x2="105" y2="78"/>
    <line x1="142" y1="90" x2="132" y2="78"/><line x1="169" y1="90" x2="159" y2="78"/>
    <line x1="196" y1="90" x2="186" y2="78"/><line x1="223" y1="90" x2="213" y2="78"/>
    <line x1="250" y1="90" x2="240" y2="78"/><line x1="277" y1="90" x2="267" y2="78"/>
  </g>
  <line x1="112" y1="90" x2="99" y2="284.6" stroke="#334155" stroke-width="2.5"/>
  <line x1="268" y1="90" x2="281" y2="284.6" stroke="#334155" stroke-width="2.5"/>
  <polygon points="103,81 121,81 112,94" fill="#94a3b8"/>
  <polygon points="259,81 277,81 268,94" fill="#94a3b8"/>
  <polygon points="99,297.6 281,297.6 281,284.6 99,284.6" fill="#dbe6fb" stroke="#2563eb" stroke-width="2"/>
  <circle cx="99" cy="284.6" r="4.5" fill="#fff" stroke="#334155" stroke-width="2"/>
  <circle cx="281" cy="284.6" r="4.5" fill="#fff" stroke="#334155" stroke-width="2"/>
  <g>
    <path d="M190,291.1 L182,291.1 A8,8 0 0 1 190,283.1 Z" fill="#1c2024"/>
    <path d="M190,291.1 L198,291.1 A8,8 0 0 1 190,299.1 Z" fill="#1c2024"/>
    <circle cx="190" cy="291.1" r="8" fill="none" stroke="#1c2024" stroke-width="1.7"/>
  </g>
  <g font-size="11" fill="#16a34a"><text x="118" y="140">50%</text><text x="242" y="140">50%</text></g>
  <rect x="96" y="322" width="188" height="24" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="190" y="339" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">★ 大域最小に静止</text>
  <text x="190" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2024">水平・左右半分ずつ</text>
  <g font-size="12" fill="#64748b">
    <text x="190" y="386" text-anchor="middle">姿勢 0.00°　張力 50% / 50%</text>
    <text x="190" y="404" text-anchor="middle">重心高さ 1.453 m（いちばん低い）</text>
  </g>

  <!-- ================= 右：局所極小 ================= -->
  <line x1="462" y1="90" x2="678" y2="90" stroke="#94a3b8" stroke-width="2.5"/>
  <g stroke="#94a3b8" stroke-width="1.4">
    <line x1="468" y1="90" x2="458" y2="78"/><line x1="495" y1="90" x2="485" y2="78"/>
    <line x1="522" y1="90" x2="512" y2="78"/><line x1="549" y1="90" x2="539" y2="78"/>
    <line x1="576" y1="90" x2="566" y2="78"/><line x1="603" y1="90" x2="593" y2="78"/>
    <line x1="630" y1="90" x2="620" y2="78"/><line x1="657" y1="90" x2="647" y2="78"/>
  </g>
  <line x1="492" y1="90" x2="523.8" y2="282.4" stroke="#334155" stroke-width="3.2"/>
  <line x1="648" y1="90" x2="454.5" y2="114.1" stroke="#334155" stroke-width="1.4"/>
  <polygon points="483,81 501,81 492,94" fill="#94a3b8"/>
  <polygon points="639,81 657,81 648,94" fill="#94a3b8"/>
  <polygon points="535.8,277.4 466.5,109.1 454.5,114.1 523.8,282.4" fill="#dbe6fb" stroke="#2563eb" stroke-width="2"/>
  <circle cx="523.8" cy="282.4" r="4.5" fill="#fff" stroke="#334155" stroke-width="2"/>
  <circle cx="454.5" cy="114.1" r="4.5" fill="#fff" stroke="#334155" stroke-width="2"/>
  <g>
    <path d="M495.1,195.8 L487.1,195.8 A8,8 0 0 1 495.1,187.8 Z" fill="#1c2024"/>
    <path d="M495.1,195.8 L503.1,195.8 A8,8 0 0 1 495.1,203.8 Z" fill="#1c2024"/>
    <circle cx="495.1" cy="195.8" r="8" fill="none" stroke="#1c2024" stroke-width="1.7"/>
  </g>
  <text x="509" y="156" font-size="12" font-weight="bold" fill="#dc2626">99%</text>
  <text x="600" y="118" font-size="11" fill="#64748b">16%</text>
  <rect x="456" y="322" width="188" height="24" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="550" y="339" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">局所極小に静止</text>
  <text x="550" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">立ち上がって片吊り</text>
  <g font-size="12" fill="#64748b">
    <text x="550" y="386" text-anchor="middle">姿勢 112.37°　張力 <tspan font-weight="bold" fill="#dc2626">99% / 16%</tspan></text>
    <text x="550" y="404" text-anchor="middle">重心高さ 2.186 m（0.73 m 高い）</text>
  </g>

  <!-- 重心高さの比較 -->
  <line x1="292" y1="291.1" x2="688" y2="291.1" stroke="#ea580c" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="292" y1="195.8" x2="688" y2="195.8" stroke="#ea580c" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="698" y1="195.8" x2="698" y2="291.1" stroke="#ea580c" stroke-width="1.4"/>
  <polygon points="698,195.8 694,205.8 702,205.8" fill="#ea580c"/>
  <polygon points="698,291.1 694,281.1 702,281.1" fill="#ea580c"/>
  <text x="705" y="247" font-size="11.5" font-weight="bold" fill="#ea580c">0.73 m</text>

  <rect x="60" y="422" width="640" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="380" y="443" text-anchor="middle" font-size="12.5" fill="#1c2024">右も「2本とも張った静止つり合い」。<tspan font-weight="bold">揺らしても自分では左に戻りません</tspan>（戻すには外から回してやる必要があります）</text>
</svg>
